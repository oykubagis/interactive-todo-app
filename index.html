<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Todo List</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 4.6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        .todo-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #edf2f7;
            padding: 1.25rem 1.5rem;
            border-radius: 12px 12px 0 0 !important;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn-custom-add {
            background-color: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1.2rem;
            font-weight: 500;
        }
        .btn-custom-add:hover {
            background-color: #4338ca;
            color: #fff;
        }
        .btn-custom-clear {
            background-color: #ef4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1.2rem;
            font-weight: 500;
        }
        .btn-custom-clear:hover {
            background-color: #dc2626;
            color: #fff;
        }
        .list-group-item {
            border: 1px solid #edf2f7;
            border-radius: 8px !important;
            margin-bottom: 8px;
            padding: 0.8rem 1.2rem;
            transition: all 0.2s ease;
        }
        .list-group-item:hover {
            background-color: #f8fafc;
        }
        .delete-item {
            color: #ef4444;
            transition: color 0.2s ease;
        }
        .delete-item:hover {
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            
            <div class="card todo-card">
                <div class="card-header">
                    <h5 class="card-title mb-0 font-weight-bold text-dark">
                        <i class="fa-solid fa-list-check mr-2 text-primary"></i>Todo List Sayfası
                    </h5>
                </div>

                <div class="card-body p-4">
                    <form id="todoAddForm">
                        <div class="form-group mb-3">
                            <input type="text" class="form-control" id="form" placeholder="Yeni bir todo giriniz...">
                        </div>
                        <button type="submit" class="btn btn-custom-add">
                            <i class="fa-solid fa-plus mr-1"></i> Todo Ekleyin
                        </button>
                    </form>
                </div> 

                <hr class="m-0" style="border-color: #edf2f7;">

                <div class="card-body p-4">
                    <h5 class="card-title font-weight-bold mb-3 text-dark">Todo Listesi</h5>
                    
                    <div class="form-group mb-3">
                        <input type="text" class="form-control" id="form2" placeholder="Listede todo arayınız...">
                    </div>
                    
                    <button type="button" id="clearButton" class="btn btn-custom-clear mb-4">
                        <i class="fa-regular fa-trash-can mr-1"></i> Tüm Todoları Temizle
                    </button>

                    <ul class="list-group">
                        <!-- Todolar buraya dinamik eklenecek -->
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
